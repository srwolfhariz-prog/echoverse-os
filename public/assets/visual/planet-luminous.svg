<svg width="1200" height="1200" viewBox="0 0 1200 1200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="orbClip">
      <circle cx="600" cy="600" r="470"/>
    </clipPath>

    <radialGradient id="baseOrb" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(410 330) rotate(45) scale(830)">
      <stop stop-color="#FFF8E8" stop-opacity="0.96"/>
      <stop offset="0.22" stop-color="#F3D48A" stop-opacity="0.78"/>
      <stop offset="0.48" stop-color="#D8A7B1" stop-opacity="0.48"/>
      <stop offset="0.72" stop-color="#8FB8D8" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#181423" stop-opacity="0.46"/>
    </radialGradient>

    <radialGradient id="moonCore" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(442 396) rotate(35) scale(420)">
      <stop stop-color="#FFFFFF" stop-opacity="0.98"/>
      <stop offset="0.22" stop-color="#FFF0C4" stop-opacity="0.66"/>
      <stop offset="0.58" stop-color="#E6B6BE" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="roseBloom" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(695 420) rotate(45) scale(410)">
      <stop stop-color="#F1B5C0" stop-opacity="0.46"/>
      <stop offset="0.46" stop-color="#D8A7B1" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#D8A7B1" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="blueBloom" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(720 760) rotate(42) scale(470)">
      <stop stop-color="#A9D1EA" stop-opacity="0.38"/>
      <stop offset="0.48" stop-color="#8FB8D8" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#8FB8D8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="warmBloom" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(486 660) rotate(30) scale(420)">
      <stop stop-color="#E8C47D" stop-opacity="0.32"/>
      <stop offset="0.5" stop-color="#D8B46A" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#D8B46A" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="shade" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(832 828) rotate(44) scale(750)">
      <stop stop-color="#050713" stop-opacity="0.32"/>
      <stop offset="0.5" stop-color="#080916" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#080916" stop-opacity="0"/>
    </radialGradient>

    <filter id="softBloom" x="-42%" y="-42%" width="184%" height="184%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="24" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1.12 0 0 0 0.55 0 1.02 0 0 0.35 0 0 1.08 0 0.44 0 0 0 0.62 0" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="wideGlow" x="-55%" y="-55%" width="210%" height="210%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="42" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 0.82 0 1 0 0 0.56 0 0 1 0 0.54 0 0 0 0.46 0"/>
    </filter>

    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.018 0.024" numOctaves="3" seed="84" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values="0.24 0 0 0 0.34 0 0.22 0 0 0.3 0 0 0.26 0 0.38 0 0 0 0.1 0" result="softNoise"/>
      <feBlend in="SourceGraphic" in2="softNoise" mode="screen"/>
    </filter>
  </defs>

  <style>
    @media (prefers-reduced-motion: no-preference) {
      .breath {
        transform-origin: 600px 600px;
        animation: breath 7.5s ease-in-out infinite;
      }

      .inner-drift {
        transform-origin: 600px 600px;
        animation: drift 24s ease-in-out infinite;
      }

      .inner-drift-alt {
        transform-origin: 600px 600px;
        animation: driftAlt 31s ease-in-out infinite;
      }
    }

    @keyframes breath {
      0%, 100% { opacity: 0.72; transform: scale(0.988); }
      50% { opacity: 1; transform: scale(1.018); }
    }

    @keyframes drift {
      0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.86; }
      50% { transform: translate(18px, -14px) scale(1.04); opacity: 1; }
    }

    @keyframes driftAlt {
      0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.7; }
      50% { transform: translate(-16px, 16px) scale(1.05); opacity: 0.92; }
    }
  </style>

  <rect width="1200" height="1200" fill="transparent"/>

  <circle cx="600" cy="600" r="520" fill="#D8B46A" opacity="0.16" filter="url(#wideGlow)"/>
  <circle cx="600" cy="600" r="500" fill="#D8A7B1" opacity="0.12" filter="url(#wideGlow)"/>
  <circle cx="600" cy="600" r="478" fill="#8FB8D8" opacity="0.1" filter="url(#wideGlow)"/>

  <g clip-path="url(#orbClip)" filter="url(#grain)">
    <circle cx="600" cy="600" r="470" fill="url(#baseOrb)" opacity="0.94"/>

    <g class="inner-drift" filter="url(#softBloom)">
      <circle cx="444" cy="398" r="208" fill="url(#moonCore)"/>
      <circle cx="660" cy="430" r="278" fill="url(#roseBloom)"/>
    </g>

    <g class="inner-drift-alt" filter="url(#softBloom)">
      <circle cx="720" cy="738" r="300" fill="url(#blueBloom)"/>
      <circle cx="500" cy="690" r="260" fill="url(#warmBloom)"/>
    </g>

    <g class="breath" filter="url(#softBloom)">
      <circle cx="600" cy="600" r="330" fill="none" stroke="#FFF4D8" stroke-opacity="0.11" stroke-width="2.2"/>
      <circle cx="600" cy="600" r="250" fill="none" stroke="#D8A7B1" stroke-opacity="0.09" stroke-width="1.8"/>
      <circle cx="600" cy="600" r="168" fill="none" stroke="#8FB8D8" stroke-opacity="0.09" stroke-width="1.6"/>
      <circle cx="600" cy="600" r="92" fill="none" stroke="#FFF4D8" stroke-opacity="0.08" stroke-width="1.4"/>
    </g>

    <g opacity="0.32">
      <circle cx="414" cy="416" r="4.4" fill="#FFF8E8"/>
      <circle cx="508" cy="330" r="2.8" fill="#FFFFFF"/>
      <circle cx="762" cy="462" r="3.6" fill="#FFF4D8"/>
      <circle cx="704" cy="748" r="4" fill="#EAF6FF"/>
      <circle cx="510" cy="820" r="2.8" fill="#FFF8E8"/>
      <circle cx="830" cy="640" r="2.6" fill="#F4EFE7"/>
    </g>

    <rect width="1200" height="1200" fill="url(#shade)"/>
    <path d="M1026 184C1188 516 1054 946 730 1088C542 1170 320 1130 162 986C286 1074 460 1096 612 1028C902 894 1030 516 868 226C926 178 982 164 1026 184Z" fill="#050713" opacity="0.16"/>
    <path d="M330 184C222 280 152 430 140 586C128 736 172 876 262 984C92 874 8 656 64 450C112 280 214 176 330 184Z" fill="#FFF8E8" opacity="0.08"/>
  </g>

  <circle cx="600" cy="600" r="470" stroke="#FFF4D8" stroke-opacity="0.16" stroke-width="2"/>
  <circle cx="600" cy="600" r="484" stroke="#8FB8D8" stroke-opacity="0.08" stroke-width="5"/>
</svg>
