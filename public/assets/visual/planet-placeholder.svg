<svg width="1200" height="1200" viewBox="0 0 1200 1200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="sphereClip">
      <circle cx="600" cy="600" r="470"/>
    </clipPath>

    <radialGradient id="glassCore" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(420 330) rotate(47) scale(820)">
      <stop stop-color="#FFF8E8" stop-opacity="0.88"/>
      <stop offset="0.26" stop-color="#F5D99C" stop-opacity="0.54"/>
      <stop offset="0.5" stop-color="#D8A7B1" stop-opacity="0.34"/>
      <stop offset="0.74" stop-color="#8FB8D8" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#171525" stop-opacity="0.82"/>
    </radialGradient>

    <radialGradient id="innerMoon" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(468 380) rotate(42) scale(520)">
      <stop stop-color="#FFFFFF" stop-opacity="0.68"/>
      <stop offset="0.22" stop-color="#FFF4D8" stop-opacity="0.3"/>
      <stop offset="0.56" stop-color="#E9BAC2" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#8FB8D8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="deepShade" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(806 824) rotate(42) scale(740)">
      <stop stop-color="#040612" stop-opacity="0.62"/>
      <stop offset="0.5" stop-color="#070817" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#070817" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="flowA" x1="164" y1="340" x2="1082" y2="746" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF8E8" stop-opacity="0"/>
      <stop offset="0.22" stop-color="#FFF1C7" stop-opacity="0.34"/>
      <stop offset="0.48" stop-color="#D8A7B1" stop-opacity="0.22"/>
      <stop offset="0.78" stop-color="#8FB8D8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#8FB8D8" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="flowB" x1="1030" y1="390" x2="178" y2="842" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8FB8D8" stop-opacity="0"/>
      <stop offset="0.27" stop-color="#B9D2E6" stop-opacity="0.24"/>
      <stop offset="0.54" stop-color="#F3D48A" stop-opacity="0.2"/>
      <stop offset="0.82" stop-color="#D8A7B1" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#D8A7B1" stop-opacity="0"/>
    </linearGradient>

    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="12"/>
    </filter>

    <filter id="grain" x="-18%" y="-18%" width="136%" height="136%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.018" numOctaves="4" seed="37" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values="0.5 0 0 0 0.24 0 0.45 0 0 0.2 0 0 0.55 0 0.32 0 0 0 0.24 0" result="softNoise"/>
      <feBlend in="SourceGraphic" in2="softNoise" mode="soft-light"/>
    </filter>

    <filter id="outerGlow" x="-42%" y="-42%" width="184%" height="184%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="26" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 0.78 0 1 0 0 0.5 0 0 1 0 0.36 0 0 0 0.5 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @media (prefers-reduced-motion: no-preference) {
      .flow-one {
        transform-origin: 600px 600px;
        animation: flowTurn 38s linear infinite;
      }

      .flow-two {
        transform-origin: 600px 600px;
        animation: flowTurnReverse 46s linear infinite;
      }

      .pulse {
        transform-origin: 600px 600px;
        animation: pulseGlow 7s ease-in-out infinite;
      }
    }

    @keyframes flowTurn {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes flowTurnReverse {
      from { transform: rotate(0deg); }
      to { transform: rotate(-360deg); }
    }

    @keyframes pulseGlow {
      0%, 100% { opacity: 0.72; transform: scale(0.985); }
      50% { opacity: 1; transform: scale(1.018); }
    }
  </style>

  <rect width="1200" height="1200" fill="transparent"/>

  <circle cx="600" cy="600" r="500" fill="#D8B46A" opacity="0.12" filter="url(#outerGlow)"/>

  <g clip-path="url(#sphereClip)">
    <circle cx="600" cy="600" r="470" fill="url(#glassCore)" opacity="0.88"/>

    <g filter="url(#grain)" opacity="0.85">
      <circle cx="470" cy="410" r="250" fill="#FFF4D8" opacity="0.12"/>
      <circle cx="700" cy="420" r="330" fill="#D8A7B1" opacity="0.1"/>
      <circle cx="690" cy="724" r="360" fill="#8FB8D8" opacity="0.12"/>
      <circle cx="380" cy="742" r="270" fill="#D8B46A" opacity="0.08"/>
    </g>

    <g class="flow-one" filter="url(#softBlur)" opacity="0.92">
      <path d="M150 410C288 344 420 368 548 430C700 504 822 474 1056 360" stroke="url(#flowA)" stroke-width="84" stroke-linecap="round"/>
      <path d="M206 534C376 490 500 526 626 584C758 644 890 610 1036 536" stroke="#FFF8E8" stroke-opacity="0.08" stroke-width="42" stroke-linecap="round"/>
    </g>

    <g class="flow-two" filter="url(#softBlur)" opacity="0.72">
      <path d="M170 678C330 606 462 628 604 696C746 764 870 736 1034 638" stroke="url(#flowB)" stroke-width="76" stroke-linecap="round"/>
      <path d="M246 820C400 760 536 782 674 846C784 896 900 878 1010 824" stroke="#F4EFE7" stroke-opacity="0.08" stroke-width="50" stroke-linecap="round"/>
    </g>

    <g class="pulse">
      <circle cx="600" cy="600" r="312" fill="none" stroke="#FFF4D8" stroke-opacity="0.08" stroke-width="2"/>
      <circle cx="600" cy="600" r="226" fill="none" stroke="#D8A7B1" stroke-opacity="0.08" stroke-width="1.5"/>
      <circle cx="600" cy="600" r="146" fill="none" stroke="#8FB8D8" stroke-opacity="0.08" stroke-width="1.5"/>
    </g>

    <g opacity="0.42">
      <circle cx="408" cy="418" r="6" fill="#FFF8E8"/>
      <circle cx="520" cy="318" r="3.5" fill="#F4EFE7"/>
      <circle cx="774" cy="458" r="4.5" fill="#FFF4D8"/>
      <circle cx="712" cy="746" r="5" fill="#F4EFE7"/>
      <circle cx="502" cy="824" r="3" fill="#FFF4D8"/>
      <circle cx="858" cy="660" r="3" fill="#F4EFE7"/>
    </g>

    <rect width="1200" height="1200" fill="url(#innerMoon)"/>
    <rect width="1200" height="1200" fill="url(#deepShade)"/>

    <path d="M1030 184C1194 516 1058 946 730 1088C542 1169 318 1131 160 986C286 1074 460 1097 612 1028C902 894 1032 514 866 226C926 178 984 164 1030 184Z" fill="#030814" opacity="0.34"/>
    <path d="M328 182C220 280 150 430 138 586C126 736 171 877 262 984C90 874 5 656 62 450C110 279 211 174 328 182Z" fill="#FFF4D8" opacity="0.08"/>
  </g>

  <circle cx="600" cy="600" r="470" stroke="#FFF4D8" stroke-opacity="0.16" stroke-width="2"/>
  <circle cx="600" cy="600" r="482" stroke="#8FB8D8" stroke-opacity="0.08" stroke-width="5"/>
</svg>
